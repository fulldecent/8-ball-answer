# Release
#
# Open or update the release pull request, test the app, and publish that
# version to the App Store.
#
# Adapted from swift6-module-template release 16.5.0:
# https://github.com/fulldecent/swift6-module-template/blob/v16.5.0/.github/workflows/release.yml
# That workflow attests a Linux static library from `swift build -c release`.
# This repository is an Xcode app. Merging the release pull request runs
# fastlane, which uploads an iOS build and submits it for review.
#
# Release Please writes VERSION, the MARKETING_VERSION lines marked
# x-release-please-version, and CHANGELOG.md. The tag is v<version>.
# skip-github-release is set because this workflow creates the tag after the
# App Store submission succeeds.
#
# One-time setup
#   1. GitHub repo > Settings > General > Releases > Enable release immutability.
#   2. GitHub repo > Settings > Actions > General > Workflow permissions: Read and write permissions.
#   3. Under Workflow permissions, check "Allow GitHub Actions to create and approve pull requests".
#   4. Sign the Apple Developer Program agreement. App Store Connect API calls fail until it is in effect.
#   5. Repository secrets:
#        APP_STORE_CONNECT_KEY_ID
#        APP_STORE_CONNECT_ISSUER_ID
#        APP_STORE_CONNECT_KEY            contents of the AuthKey .p8 file
#        APP_STORE_DISTRIBUTION_P12       base64 of the Apple Distribution identity
#        APP_STORE_DISTRIBUTION_P12_PASSWORD
#      Export the identity from the login keychain (this prompts once):
#        security export -k ~/Library/Keychains/login.keychain-db -t identities -f pkcs12 \
#          -o /tmp/distribution.p12 -P "$PASSWORD"
#        base64 < /tmp/distribution.p12 | gh secret set APP_STORE_DISTRIBUTION_P12 --repo fulldecent/8-ball-answer
#        gh secret set APP_STORE_DISTRIBUTION_P12_PASSWORD --repo fulldecent/8-ball-answer --body "$PASSWORD"
#        rm /tmp/distribution.p12

name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.5.2. Leave empty to open or update the release pull request only.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    name: Open or update the release pull request
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find a merged release pull request
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) v\(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: Build and test
    needs: propose
    if: |
      always() &&
      (needs.propose.result == 'success' || needs.propose.result == 'skipped') &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to the App Store
    needs: [propose, build-test]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          P12: ${{ secrets.APP_STORE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KEY" ]; then echo "Missing secret APP_STORE_CONNECT_KEY" >&2; missing=1; fi
          if [ -z "$P12" ]; then echo "Missing secret APP_STORE_DISTRIBUTION_P12" >&2; missing=1; fi
          if [ -z "$P12_PASSWORD" ]; then echo "Missing secret APP_STORE_DISTRIBUTION_P12_PASSWORD" >&2; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "The export commands are in .github/workflows/release.yml" >&2
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Import the distribution certificate
        env:
          P12_BASE64: ${{ secrets.APP_STORE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/distribution.p12"

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" python3 - << 'PY'
          import json, os
          key_id = os.environ["KEY_ID"]
          json.dump({
              "key_id": key_id,
              "issuer_id": os.environ["ISSUER_ID"],
              "key_filepath": os.environ["RUNNER_TEMP"] + f"/private_keys/AuthKey_{key_id}.p8",
              "in_house": False,
          }, open("fastlane/api_key.json", "w"))
          PY

      - name: Publish to the App Store
        run: bundle exec fastlane ios publish_app_store

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          case "$TAG" in
            v*.*.*) ;;
            *) echo "tag must look like v1.5.2" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Mark the release pull request tagged
        if: needs.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/autorelease:%20pending"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=autorelease: tagged"
