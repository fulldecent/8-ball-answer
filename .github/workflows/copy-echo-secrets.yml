name: Copy store secrets to echo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: Copy store secrets to echo
    runs-on: ubuntu-latest
    steps:
      - name: Copy the seven App Store secrets
        env:
          GH_TOKEN: ${{ secrets.ECHO_COPY_TOKEN }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_DISTRIBUTION_P12: ${{ secrets.APP_STORE_DISTRIBUTION_P12 }}
          APP_STORE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
          APP_STORE_MAC_INSTALLER_P12: ${{ secrets.APP_STORE_MAC_INSTALLER_P12 }}
          APP_STORE_MAC_INSTALLER_P12_PASSWORD: ${{ secrets.APP_STORE_MAC_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          copy() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "missing $name" >&2
              exit 1
            fi
            printf '%s' "$value" | gh secret set "$name" --repo fulldecent/echo
            echo "set $name"
          }
          copy APP_STORE_CONNECT_KEY_ID "$APP_STORE_CONNECT_KEY_ID"
          copy APP_STORE_CONNECT_ISSUER_ID "$APP_STORE_CONNECT_ISSUER_ID"
          copy APP_STORE_CONNECT_KEY "$APP_STORE_CONNECT_KEY"
          copy APP_STORE_DISTRIBUTION_P12 "$APP_STORE_DISTRIBUTION_P12"
          copy APP_STORE_DISTRIBUTION_P12_PASSWORD "$APP_STORE_DISTRIBUTION_P12_PASSWORD"
          copy APP_STORE_MAC_INSTALLER_P12 "$APP_STORE_MAC_INSTALLER_P12"
          copy APP_STORE_MAC_INSTALLER_P12_PASSWORD "$APP_STORE_MAC_INSTALLER_P12_PASSWORD"
          gh secret list --repo fulldecent/echo
